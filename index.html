<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clips FAHHntásticos · panel en vivo</title>
<style>
:root{--bg:#f6f4f2;--card:#fff;--fg:#1d1a1a;--mute:#6b6464;--line:#e4dfdc;--red:#e5262b;--ok:#1f8a4c;--warn:#b7791f;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#171414;--card:#221e1e;--fg:#f3eeee;--mute:#a79e9e;--line:#352f2f;--red:#ff4a4f;--ok:#4cc27d;--warn:#e0a84a;--bad:#ff7a6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1{font:400 34px/1 Impact,sans-serif;color:var(--red);margin:0;letter-spacing:.03em}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:6px 0 0}
.sub{color:var(--mute);margin:4px 0 0}.fecha{color:var(--mute);font-size:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.c span{display:block;font-size:12px;color:var(--mute)}.c b{font-size:26px;font-variant-numeric:tabular-nums}
.s{display:flex;gap:12px;align-items:center;justify-content:space-between}.s>div{min-width:0}
.s a{color:var(--red);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.s small{color:var(--mute);font-variant-numeric:tabular-nums}
svg{flex:none;width:96px;height:32px}
.pill{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-right:6px;color:var(--mute)}
.pill.hecho{color:var(--ok);border-color:var(--ok)}.pill.error{color:var(--bad);border-color:var(--bad)}.pill.en{color:var(--warn);border-color:var(--warn)}
ul{margin:0;padding-left:1.2em}li{margin:4px 0}.vacio{color:var(--mute)}
</style></head><body><main>
<header><h1 id="t">Clips FAHHntásticos</h1><p class="sub" id="st"></p><span class="fecha" id="u">Cargando…</span></header>
<div class="g" id="kpi"></div>
<h2>Publicados</h2><div id="shorts" style="display:flex;flex-direction:column;gap:8px"></div>
<h2>Cola de análisis (VODs)</h2><div id="cola" style="display:flex;flex-direction:column;gap:6px"></div>
<h2>En cola</h2><ul id="encola"></ul>
<h2>Previews pendientes de OK</h2><div id="previews" class="vacio">Ninguna por ahora.</div>
<h2>Espera el OK de Diego</h2><ul id="espera"></ul>
<h2>Decisiones por defecto</h2><ul id="reglas"></ul>
<h2>Próximos pasos</h2><ul id="proximos"></ul>
<h2>Hecho hasta ahora</h2><ul id="hecho"></ul>
</main>
<script>
const $=id=>document.getElementById(id),n=x=>Number(x).toLocaleString('es');
const J=f=>fetch(f+'?'+Date.now()).then(r=>r.json()).catch(()=>null);
function li(el,arr){(arr||[]).forEach(t=>{const e=document.createElement('li');e.textContent=t;el.append(e)})}
function spark(vals){const NS='http://www.w3.org/2000/svg',s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 96 32');
 if(vals.length<2){return s}
 const mx=Math.max(...vals),mn=Math.min(...vals),r=(mx-mn)||1,p=vals.map((v,i)=>(i*94/(vals.length-1)+1)+','+(30-(v-mn)*28/r)).join(' ');
 const l=document.createElementNS(NS,'polyline');l.setAttribute('points',p);l.setAttribute('fill','none');l.setAttribute('stroke','var(--red)');l.setAttribute('stroke-width','2');l.setAttribute('stroke-linejoin','round');s.append(l);return s}
Promise.all([J('panel.json'),J('historial.json'),J('cola.json'),J('contenido.json')]).then(([p,h,cola,ct])=>{
 if(ct){$('t').textContent=ct.titulo;$('st').textContent=ct.subtitulo;li($('espera'),ct.espera);li($('encola'),ct.en_cola);(ct.previews||[]).forEach((p,i)=>{if(!i)$('previews').textContent='';const e=document.createElement('div');e.className='c';e.textContent=p.streamer+' · '+p.titulo+' · '+p.nombre;$('previews').append(e)});li($('reglas'),ct.reglas);li($('proximos'),ct.proximos);li($('hecho'),ct.hecho);if(ct.notas_fecha){const f=document.createElement('p');f.className='fecha';f.textContent=ct.notas_fecha;document.querySelector('main').append(f)}}
 if(!p){$('u').textContent='Aún no hay datos.';return}
 $('u').textContent='Actualizado '+new Date(p.actualizado).toLocaleString('es');
 const tot=k=>p.shorts.reduce((a,s)=>a+s[k],0),k=(a,b)=>{const e=document.createElement('div');e.className='c';const sp=document.createElement('span');sp.textContent=a;const bb=document.createElement('b');bb.textContent=b;e.append(sp,bb);return e};
 $('kpi').append(k('Suscriptores',n(p.suscriptores)),k('Vistas en Shorts',n(tot('vistas'))),k('Me gusta',n(tot('likes'))),k('Comentarios',n(tot('comentarios'))),k('Shorts publicados',p.shorts.length));
 p.shorts.forEach(s=>{const e=document.createElement('div');e.className='c s';const d=document.createElement('div');
  const a=document.createElement('a');a.href='https://youtube.com/shorts/'+s.id;a.textContent=s.titulo;a.rel='noopener';
  const sm=document.createElement('small');sm.textContent=n(s.vistas)+' vistas · '+s.likes+' me gusta · '+s.comentarios+' comentarios · publicado '+new Date(s.publicado).toLocaleDateString('es');
  d.append(a,document.createElement('br'),sm);e.append(d,spark((h||[]).map(x=>x.vistas&&x.vistas[s.id]).filter(v=>v!=null)));$('shorts').append(e)});
 const C=$('cola');if(!cola||!cola.cola.length){C.textContent='Sin VODs en la cola.';C.className='vacio'}else cola.cola.forEach(c=>{const e=document.createElement('div');e.className='c';
  const pl=document.createElement('span');pl.className='pill '+(c.estado==='hecho'?'hecho':c.estado==='error'?'error':c.estado==='en curso'?'en':'');pl.style.display='inline-block';pl.textContent=c.estado;
  const t=document.createElement('span');t.style.display='inline';t.style.color='var(--fg)';t.textContent=c.nota+' · VOD '+c.id;e.append(pl,t);C.append(e)});
});
</script></body></html>
